# 單 VM 容器化部署（目標：Linux VM）。
#
# 兩個服務都走 host network，原因：
# 1) qooqd 的 http health probe 是從 qooqd 自己的網路 namespace 打
#    127.0.0.1:{HostPort}（v1 拍板行為）；bridge 網路下容器看不到 host 上
#    發布的 port，probe 永遠失敗。host network 是正解。
# 2) 因此 bind 位址沿用原生部署的安全立場：只 bind 127.0.0.1。
#    要對外開 webhook（:7778），用 host 上的 reverse proxy 轉發。
# macOS Docker Desktop 對 host networking 支援有限——本檔請在 Linux 上用；
# mac 開發直接 `make run-qooqd` 跑原生 binary。
#
# 啟動前先準備 .env：
#   QOOQ_TOKEN=<qooqd API token>
#   QOOQ_WATCHER_SECRET_KEY=<credential 加密 key>
#   QOOQ_WATCHER_HTTP_TOKEN=<watcher API token，可留空>
services:
  qooqd:
    build:
      context: .
      target: qooqd
    image: qooq/qooqd
    network_mode: host
    restart: unless-stopped
    environment:
      QOOQ_TOKEN: ${QOOQ_TOKEN:?set in .env}
    command: ["-listen", "127.0.0.1:7777", "-data", "/data/qooq.db", "-backup-dir", "/data/backups"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - qooqd-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7777/v1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      # 啟動期每秒 probe：讓 depends_on 的 watcher 不用白等第一個 15s tick
      start_period: 15s
      start_interval: 1s

  qooq-watcher:
    build:
      context: .
      target: qooq-watcher
    image: qooq/qooq-watcher
    network_mode: host
    restart: unless-stopped
    environment:
      QOOQ_WATCHER_HTTP_HOST: 127.0.0.1
      QOOQ_WATCHER_HTTP_PORT: "7778"
      QOOQ_WATCHER_QOOQD_ADDR: http://127.0.0.1:7777
      QOOQ_WATCHER_QOOQD_TOKEN: ${QOOQ_TOKEN:?set in .env}
      QOOQ_WATCHER_HTTP_TOKEN: ${QOOQ_WATCHER_HTTP_TOKEN:-}
      QOOQ_WATCHER_SECRET_KEY: ${QOOQ_WATCHER_SECRET_KEY:?set in .env}
      # sqlite/artifacts/backup 路徑已在 image 內設好（/data 底下）
    volumes:
      - watcher-data:/data
    depends_on:
      qooqd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7778/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s

volumes:
  qooqd-data:
  watcher-data:
